name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pgbv-Test-Pw-7731
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The integration tests use this server instead of starting a container.
      PGBV_TEST_URL: postgres://postgres:pgbv-Test-Pw-7731@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the PostgreSQL 16 client (same major as the service)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pg_restore --version && psql --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
